name: Keep Streamlit App Awake

# Streamlit Community Cloud sleeps an app after 12 hours with no traffic.
# This runs well inside that window and, using a real headless browser,
# either resets the sleep timer (if awake) or clicks the app back up
# (if it's already asleep) — so visitors never hit a cold-start wait.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # allows manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app / wake it if asleep
        env:
          STREAMLIT_APP_URL: https://ssu-energy-dashboard-usb4padbsjz7yz8tdq36zz.streamlit.app/
        run: python keep_alive.py
